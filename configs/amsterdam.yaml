study_area:
  name: "Amsterdam"
  bbox_rd:  [110188, 476709, 135933, 493894]   # EPSG:28992 — from PDOK Bestuurlijke Gebieden
  bbox_wgs: [4.7288, 52.2780, 5.1077, 52.4311] # EPSG:4326
  crs: "EPSG:28992"

pipeline:
  use_3dbag: false

data_paths:
  ep_online_csv: "data/raw/v20260401_v4_csv/v20260401_v4_csv.csv"
  processed_dir: "data/processed/amsterdam"
  joined_output: "data/processed/amsterdam/bag_ep_joined.parquet"
  tabula_csv:    "data/processed/tabula_nl.csv"
  tabula_output: "data/processed/amsterdam/residential_tabula_matched.parquet"

ep_online:
  postcode_prefixes: ["10", "11"]
  building_class: "W"

wfs:
  bag_url: "https://service.pdok.nl/lv/bag/wfs/v2_0"
  bag_layer: "bag:pand"
  bag_page_size: 1000

filters:
  bouwjaar_min: 1800
  bouwjaar_max: 2026
  min_buildings: 50
